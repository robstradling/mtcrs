<g class="text">
<text x="244" y="20">Issuance: the CA hashes a secret seed forward to the anchor,</text>
<text x="176" y="36">then commits the anchor in the certificate.</text>
<text x="44" y="84">h[0]</text>
<text x="132" y="84">h[1]</text>
<text x="220" y="84">h[2]</text>
<text x="308" y="84">h[3]</text>
<text x="396" y="84">h[4]</text>
<text x="484" y="84">h[5]</text>
<text x="36" y="116">seed</text>
<text x="96" y="116">\</text>
<text x="260" y="116">each arrow is one hash operation</text>
<text x="424" y="116">/</text>
<text x="476" y="116">anchor</text>
<text x="44" y="132">(secret)</text>
<text x="476" y="132">(committed</text>
<text x="476" y="148">in cert)</text>
<text x="228" y="180">Each period, the CA reveals one value, walking the chain</text>
<text x="244" y="196">backward; the revealed value is that period's public &quot;tick&quot;.</text>
<text x="48" y="228">period:</text>
<text x="104" y="228">0</text>
<text x="176" y="228">1</text>
<text x="248" y="228">2</text>
<text x="320" y="228">3</text>
<text x="392" y="228">4</text>
<text x="40" y="244">tick:</text>
<text x="108" y="244">h[5]</text>
<text x="180" y="244">h[4]</text>
<text x="252" y="244">h[3]</text>
<text x="324" y="244">h[2]</text>
<text x="396" y="244">h[1]</text>
<text x="108" y="260">(anchor)</text>
<text x="260" y="276">(the seed h[0] is never revealed; revealing stops to revoke)</text>
<text x="248" y="308">Verify a tick for period t: hash it forward t times and check</text>
<text x="88" y="324">it equals the anchor.</text>
<text x="224" y="324">Period 2:</text>
<text x="292" y="324">h[3]</text>
<text x="364" y="324">h[4]</text>
<text x="440" y="324">h[5].</text>
</g>
